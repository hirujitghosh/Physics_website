<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Staff record · simple form</title>
  <!-- Firebase (kept exactly as original, using your variable names) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, Timestamp, deleteDoc, doc, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDctGOxP-2c38cMV8LgdKfRiy7Ovb1y0tA",
      authDomain: "bup-nodal.firebaseapp.com",
      projectId: "bup-nodal",
      storageBucket: "bup-nodal.firebasestorage.app",
      messagingSenderId: "206787101835",
      appId: "1:206787101835:web:eda0356ac5c850748ac08e",
      measurementId: "G-C1615N2K1M"
    };

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    const auth = getAuth(app);

    window.db = db;
    window.auth = auth;
    window.Timestamp = Timestamp;
    window.collection = collection;
    window.addDoc = addDoc;
    window.getDocs = getDocs;
    window.query = query;
    window.orderBy = orderBy;
    window.deleteDoc = deleteDoc;
    window.doc = doc;
    window.where = where;
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    }
    body {
      background: #eef2f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      background: #ffffff;
      max-width: 700px;
      width: 100%;
      border-radius: 32px;
      box-shadow: 0 20px 35px -8px rgba(16, 52, 94, 0.2);
      overflow: hidden;
    }
    .card-body {
      padding: 2rem 2rem 2rem;
    }
    .header-minimal {
      margin-bottom: 2rem;
      text-align: center;
    }
    .header-minimal h2 {
      color: #10345e;
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: -0.5px;
    }
    .header-minimal p {
      color: #4a5b7a;
      font-size: 1.1rem;
      margin-top: 0.3rem;
    }
    /* simple form card */
    .simple-form {
      background: #f9fbfe;
      border-radius: 32px;
      padding: 2.2rem 2rem 2.5rem;
      border: 1px solid #d9e1ec;
      box-shadow: inset 0 2px 4px #ffffff, 0 6px 14px rgba(0,20,40,0.05);
    }
    .field {
      margin-bottom: 2rem;
    }
    .field label {
      display: block;
      font-weight: 600;
      color: #1f3a60;
      margin-bottom: 0.5rem;
      font-size: 1.1rem;
    }
    .field label i {
      color: #b31b1b;
      font-style: normal;
      margin-left: 5px;
    }
    .field input {
      width: 100%;
      padding: 1rem 1.3rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 30px;
      font-size: 1.1rem;
      background: white;
      transition: 0.15s;
    }
    .field input:focus {
      border-color: #10345e;
      outline: none;
      box-shadow: 0 0 0 3px rgba(16,52,94,0.2);
    }
    /* designation is now a text box, no dropdown */
    .field input#currentDesig {
      background: white;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      margin-top: 2rem;
    }
    @media (min-width: 500px) {
      .button-group {
        flex-direction: row;
        justify-content: flex-end;
      }
    }
    .btn {
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    @media (min-width: 500px) {
      .btn {
        width: auto;
      }
    }
    .btn-primary {
      background: #10345e;
      color: white;
      box-shadow: 0 8px 20px rgba(16,52,94,0.3);
    }
    .btn-primary:hover:not(:disabled) {
      background: #0b2a4a;
    }
    .btn-primary:disabled {
      background: #7f8fa4;
      box-shadow: none;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #e3e9f2;
      color: #1f3a60;
    }
    .btn-secondary:hover {
      background: #d0daea;
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.3rem;
      border-top: 1px dashed #bdc7d6;
      color: #4a5b7a;
      font-size: 0.98rem;
    }
    /* subtle message banner (optional) */
    .info-note {
      background: #ecf3fa;
      border-radius: 40px;
      padding: 0.7rem 1.5rem;
      margin-bottom: 2rem;
      color: #10345e;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      justify-content: center;
      border: 1px solid #b9d1ef;
    }
    /* modal for feedback */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 1rem;
    }
    .modal-content {
      background: white;
      max-width: 400px;
      width: 100%;
      padding: 2rem 1.8rem;
      border-radius: 32px;
      text-align: center;
      box-shadow: 0 25px 40px rgba(0,0,0,0.2);
    }
    .modal-content h3 {
      color: #10345e;
      margin-bottom: 1rem;
      font-weight: 600;
    }
    .modal-content p {
      margin-bottom: 1.8rem;
      color: #1f2a3f;
      font-size: 1.1rem;
    }
    .modal-content button {
      background: #10345e;
      color: white;
      border: none;
      padding: 0.7rem 2.5rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
    }
    /* Success confirmation banner (new) */
    .confirmation-banner {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
      border-radius: 50px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 600;
      font-size: 1.1rem;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .confirmation-banner.show {
      display: flex;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="card-body">
    <!-- simple header, no admin traces -->
    <div class="header-minimal">
      <h2>📋 Staff record</h2>
      <p>HRMS ID · Name · Designation (any staff)</p>
    </div>

    <!-- optional friendly note -->
    <div class="info-note">
      <span>✏️ Please fill in your current designation (text field)</span>
    </div>

    <!-- CONFIRMATION BANNER (appears after successful Firestore update) -->
    <div id="confirmationBanner" class="confirmation-banner">
      <span>✅</span> Database updated successfully!
    </div>

    <!-- form with three text fields: hrms, name, designation (text box) -->
    <div class="simple-form">
      <!-- ORIGINAL VARIABLE NAMES: empName, hrms, currentDesig -->
      <form id="promotionForm">
        <!-- HRMS ID (matches original id="hrms") -->
        <div class="field">
          <label>HRMS ID <i>*</i></label>
          <input type="text" id="hrms" placeholder="e.g. EMP12345" autocomplete="off" required>
        </div>

        <!-- Full Name (matches original id="empName") -->
        <div class="field">
          <label>Full Name <i>*</i></label>
          <input type="text" id="empName" placeholder="Enter full name" required>
        </div>

        <!-- Designation: now a simple text box (using original id="currentDesig") -->
        <div class="field">
          <label>Designation <i>*</i></label>
          <input type="text" id="currentDesig" placeholder="e.g. Lab Assistant, Clerk, Professor, etc." required>
        </div>

        <!-- no other fields (dept, dates, etc. are gone) -->
        <div class="button-group">
          <button type="reset" class="btn btn-secondary">↻ Reset</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">✓ Submit</button>
        </div>
      </form>
    </div>

    <!-- footer (identical) -->
    <footer> This page is personally maintained by AH. Contact him if there is any doubt.</footer>
  </div>
</div>

<!-- modal for user messages (using your original closeModal id) -->
<div id="teacherModal" class="modal">
  <div class="modal-content">
    <h3 id="modalName">Notice</h3>
    <p id="modalDetails" style="margin-bottom:1.8rem;"></p>
    <button id="closeModal" style="background:#10345e; color:white; border:none; padding:0.7rem 2.5rem; border-radius:40px; font-weight:600; cursor:pointer;">OK</button>
  </div>
</div>

<script type="module">
  // Import exactly as in your original (kept for consistency)
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, Timestamp, deleteDoc, doc, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
  import { getAuth } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

  // Use the globals set in the first script
  const db = window.db;
  const auth = window.auth;
  const Timestamp = window.Timestamp;

  // DOM elements – using ORIGINAL variable names from your working code
  const empName = document.getElementById('empName');       // name field
  const hrms = document.getElementById('hrms');             // hrms field
  const desigSelect = document.getElementById('currentDesig'); // designation text box (originally was select, now text)
  const submitBtn = document.getElementById('submitBtn');
  const form = document.getElementById('promotionForm');    // original form id

  // Confirmation banner element
  const confirmationBanner = document.getElementById('confirmationBanner');

  // Modal elements (original names)
  const modal = document.getElementById('teacherModal');
  const modalName = document.getElementById('modalName');
  const modalDetails = document.getElementById('modalDetails');
  const closeModal = document.getElementById('closeModal');

  // Simple modal functions (using your original variable names)
  function showModal(title, msg) {
    modalName.textContent = title;
    modalDetails.textContent = msg;
    modal.classList.add('active');
    modal.style.display = 'flex';
  }

  // Close modal (original closeModal listener)
  closeModal.addEventListener('click', () => {
    modal.classList.remove('active');
    modal.style.display = 'none';
  });
  window.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.classList.remove('active');
      modal.style.display = 'none';
    }
  });

  // Helper: check duplicate HRMS (exactly your isHrmsDuplicate logic)
  async function isHrmsDuplicate(hrmsId) {
    if (!hrmsId) return false;
    const q = query(collection(db, 'teachers'), where('hrms', '==', hrmsId));
    const snap = await getDocs(q);
    return !snap.empty;
  }

  // Function to show confirmation banner
  function showConfirmation(message) {
    confirmationBanner.innerHTML = `<span>✅</span> ${message}`;
    confirmationBanner.classList.add('show');
    
    // Auto-hide after 5 seconds
    setTimeout(() => {
      confirmationBanner.classList.remove('show');
    }, 5000);
  }

  // Form submit – using original field variable names
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    // Get values from original variable names
    const hrmsValue = hrms.value.trim();
    const nameValue = empName.value.trim();
    const designationValue = desigSelect.value.trim();  // free text from textbox

    if (!hrmsValue || !nameValue || !designationValue) {
      showModal('Missing info', 'Please fill in HRMS, Name and Designation.');
      return;
    }

    // Disable button to prevent double submission (original submitBtn)
    submitBtn.disabled = true;

    try {
      // Check duplicate using original function
      const duplicate = await isHrmsDuplicate(hrmsValue);
      if (duplicate) {
        showModal('Duplicate HRMS', 'A record with this HRMS ID already exists. Submission not allowed.');
        submitBtn.disabled = false;
        return;
      }

      // Prepare data – using same field names as your original (but without extra CAS fields)
      const data = {
        name: nameValue,
        // Department is no longer in form, but we can store a placeholder or omit.
        // To keep structure similar, we'll store empty string for dept (or omit)
        // But your original code expects dept to exist? We'll set a default to avoid errors.
        dept: "not specified",   // was originally required, we set a placeholder
        hrms: hrmsValue,
        designation: designationValue,   // now free text
        timestamp: Timestamp.now()
        // no phdDate, no promo fields – they are optional in your original
      };

      // Add document to 'teachers' collection (exactly as your original addDoc)
      await addDoc(collection(db, 'teachers'), data);

      // Show confirmation banner that Firestore was updated
      showConfirmation('Firestore database updated successfully!');
      
      // Also show modal for good measure (optional)
      showModal('Success ✅', `Thank you, ${nameValue}. Your information has been recorded.`);

      // Reset form (original method)
      form.reset();
    } catch (error) {
      console.error(error);
      showModal('Error', 'Something went wrong. Please try again later.');
    } finally {
      submitBtn.disabled = false;
    }
  });

  // Note: No admin toggle, no table – exactly as requested.
  // The original variables like promo12, stage12 etc. are not used.
  // All Firebase methods remain unchanged.
</script>

<!-- ensure modal hidden by default (style already has display:none) -->
<style>
  .modal { display: none; } /* hidden by default */
  .modal.active { display: flex; } /* when active */
</style>
</body>
</html>
